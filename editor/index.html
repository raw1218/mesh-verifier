<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stylized Character Editor</title>
<style>
  :root { --bg: #eceae6; --ink: #1d1c1a; --muted: #6a665f; --panel: rgba(255,255,255,.93); --line: #d6d1c8; --accent: #b4553a; --on: #b4553a22; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #16171a; --ink: #e9e6e0; --muted: #9e998f; --panel: rgba(30,31,35,.93); --line: #393a3f; --on: #b4553a44; color-scheme: dark; } }
  :root[data-theme="dark"] { --bg: #16171a; --ink: #e9e6e0; --muted: #9e998f; --panel: rgba(30,31,35,.93); --line: #393a3f; --on: #b4553a44; color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 13px/1.4 system-ui, "Segoe UI", sans-serif; overflow: hidden; }
  #view { position: fixed; inset: 0; }
  .panel { position: fixed; top: 10px; max-height: calc(100% - 20px); overflow: auto; background: var(--panel);
           border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; box-sizing: border-box; }
  #shape { left: 10px; width: 300px; }
  #rig { right: 10px; width: 270px; }
  h1 { font-size: 14px; margin: 0 0 2px; }
  h2 { font-size: 11px; margin: 12px 0 4px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
  .row { display: grid; grid-template-columns: 1fr 100px 40px; gap: 6px; align-items: center; margin: 1px 0; }
  .row input { width: 100%; margin: 0; }
  .row output { color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; font-size: 12px; }
  .hint { color: var(--muted); font-size: 12px; }
  button { font: inherit; color: var(--ink); background: transparent; border: 1px solid var(--line); border-radius: 4px; padding: 2px 8px; cursor: pointer; margin: 2px 2px 2px 0; }
  button:hover { border-color: var(--accent); }
  button.on { background: var(--on); border-color: var(--accent); }
  #status { position: fixed; left: 50%; transform: translateX(-50%); bottom: 10px; color: var(--muted); font-size: 12px; background: var(--panel); padding: 4px 10px; border-radius: 6px; border: 1px solid var(--line); }
  details summary { cursor: pointer; color: var(--muted); font-size: 12px; margin-top: 8px; }
</style>
</head>
<body>
<div id="view"></div>
<div id="shape" class="panel">
  <h1>Raven, stylized</h1>
  <div class="hint">Every part makes its shape and its rig together: move a slider and the joints move with it.</div>
  <div id="params"></div>
  <h2>Show</h2>
  <button data-view="3/4">3/4</button><button data-view="side">Side</button><button data-view="front">Front</button><button data-view="top">Top</button><br>
  <button id="colours" class="on">Part colours</button><button id="wire">Wireframe</button><button id="showJoints">Joints</button><button id="showSkull">Skull</button><button id="seeThrough">See-through skin</button><button id="ref">Tripo raven beside it</button><button id="overlay">Tripo raven over it</button><button id="hideBeaks">Hide beaks</button>
  <h2>Files</h2>
  <button id="save">Save and verify</button> <button id="reset">Reset sliders</button> <button id="tripoMatch">Tripo match</button>
  <div id="saved" class="hint"></div>
</div>
<div id="rig" class="panel">
  <h1>Rig</h1>
  <div class="hint">Poses use the rig file the parts made (the same one the verifier and Unreal read).</div>
  <h2>Poses</h2>
  <div id="poses"></div>
  <button id="play">Play all</button>
  <details open><summary>Controls</summary><div id="controls"></div></details>
</div>
<div id="status">building…</div>

<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.174.0/build/three.module.js",
               "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.174.0/examples/jsm/" } }
</script>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { PARAMS, DEFAULTS, build } from "./raven.js";
import { toScene, exportFiles } from "./scene.js";

const POSES = {
  neutral: {},
  "beak open": { jawOpen: 1 },
  blink: { eyeBlink_L: 1, eyeBlink_R: 1 },
  smile: { mouthSmile_L: 1, mouthSmile_R: 1, eyeSquint_L: 0.6, eyeSquint_R: 0.6, browOuterUp_L: 0.3, browOuterUp_R: 0.3 },
  angry: { browDown_L: 1, browDown_R: 1, mouthFrown_L: 0.7, mouthFrown_R: 0.7, eyeSquint_L: 0.4, eyeSquint_R: 0.4, jawOpen: 0.15 },
  surprised: { browInnerUp: 1, browOuterUp_L: 0.8, browOuterUp_R: 0.8, eyeWide_L: 1, eyeWide_R: 1, jawOpen: 0.55 },
  sad: { browInnerUp: 0.9, mouthFrown_L: 1, mouthFrown_R: 1, eyeLookDown_L: 0.5, eyeLookDown_R: 0.5 },
  "look left": { eyeLookOut_L: 1, eyeLookIn_R: 1 },
  "look up": { eyeLookUp_L: 1, eyeLookUp_R: 1 },
  "caw": { jawOpen: 1, mouthStretch_L: 1, mouthStretch_R: 1, browDown_L: 0.5, browDown_R: 0.5, eyeSquint_L: 0.5, eyeSquint_R: 0.5 },
};

const params = { ...DEFAULTS };
try { Object.assign(params, JSON.parse(localStorage.getItem("raven-params") || "{}")); } catch {}
let ch, sc, pose = {}, jointDots = null;
const status = document.getElementById("status");

// ---- viewport ----
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(devicePixelRatio);
document.getElementById("view").appendChild(renderer.domElement);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(30, 1, 0.05, 100);
const orbit = new OrbitControls(camera, renderer.domElement);
const VIEWS = { "3/4": [1, 0.25, 0.9], side: [1, 0.05, 0], front: [0, 0.05, 1], top: [0, 1, 0.02] };
function view(name) {
  const d = new THREE.Vector3(...VIEWS[name]).normalize();
  orbit.target.set(0, -0.1, 0.9);
  camera.position.copy(orbit.target).addScaledVector(d, 15);
  orbit.update();
}
view("3/4");
window.editor = { camera, orbit, scene, view };
scene.add(new THREE.HemisphereLight(0xffffff, 0x444450, 1.6));
const sun = new THREE.DirectionalLight(0xffffff, 1.8); sun.position.set(3, 5, 6); scene.add(sun);
function resize() { renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); }
addEventListener("resize", resize); resize();
const bg = () => getComputedStyle(document.documentElement).getPropertyValue("--bg").trim();
renderer.setAnimationLoop(() => { scene.background = new THREE.Color(bg()); renderer.render(scene, camera); });

// ---- shape panel ----
const box = document.getElementById("params");
let group = null;
for (const [g, key, label, min, max, , kind] of PARAMS) {
  if (g !== group) { group = g; box.insertAdjacentHTML("beforeend", `<h2>${g}</h2>`); }
  if (kind === "check")                            // (an on/off: a box)
    box.insertAdjacentHTML("beforeend", `<label class="row check"><span>${label}</span><input type="checkbox" data-key="${key}" ${params[key] >= 0.5 ? "checked" : ""}></label>`);
  else box.insertAdjacentHTML("beforeend", `<label class="row"><span>${label}</span><input type="range" data-key="${key}" min="${min}" max="${max}" step="${(max - min) / 200}" value="${params[key]}"><output>${(+params[key]).toFixed(2)}</output></label>`);
}
let timer = null;
box.addEventListener("input", e => {
  const k = e.target.dataset.key; if (!k) return;
  params[k] = e.target.type === "checkbox" ? (e.target.checked ? 1 : 0) : +e.target.value;
  if (e.target.type !== "checkbox") e.target.nextElementSibling.textContent = params[k].toFixed(2);
  clearTimeout(timer); timer = setTimeout(rebuild, 120);
});

function rebuild() {
  try { localStorage.setItem("raven-params", JSON.stringify(params)); } catch {}
  status.textContent = "building…";
  setTimeout(() => {
    const t0 = performance.now();
    ch = build(params, { skull: document.getElementById("showSkull").classList.contains("on") });
    if (sc) { scene.remove(sc.group); sc.meshes.forEach(m => { m.geometry.dispose(); m.material.dispose(); }); }
    sc = toScene(ch);
    scene.add(sc.group);
    showSkull();
    applyLook();
    hideBeaks();
    sc.pose(pose);
    showJoints();
    buildControls();
    const nv = ch.parts.reduce((s, p) => s + p.positions.length / 3, 0);
    status.textContent = `${ch.parts.length} parts, ${nv} vertices, ${ch.joints.length} joints, ${ch.rig.controls.length} controls · built in ${Math.round(performance.now() - t0)} ms`;
  }, 10);
}

// ---- rig panel ----
const posesBox = document.getElementById("poses");
for (const name of Object.keys(POSES)) posesBox.insertAdjacentHTML("beforeend", `<button data-pose="${name}">${name}</button>`);
posesBox.addEventListener("click", e => { const n = e.target.dataset.pose; if (n) setPose({ ...POSES[n] }, true); });
function setPose(p, animate) {
  const from = { ...pose }, to = p, keys = new Set([...Object.keys(from), ...Object.keys(to)]);
  if (!animate) { pose = to; sc.pose(pose); syncControls(); return; }
  const t0 = performance.now();
  const step = () => {
    const t = Math.min((performance.now() - t0) / 250, 1), s = t * t * (3 - 2 * t);
    pose = {}; for (const k of keys) pose[k] = (from[k] || 0) + ((to[k] || 0) - (from[k] || 0)) * s;
    sc.pose(pose); syncControls();
    if (t < 1) requestAnimationFrame(step);
  };
  step();
}
document.getElementById("play").onclick = async () => {
  for (const n of Object.keys(POSES)) { setPose({ ...POSES[n] }, true); status.textContent = n; await new Promise(r => setTimeout(r, 900)); }
  setPose({}, true);
};
function buildControls() {
  const box = document.getElementById("controls");
  box.innerHTML = ch.rig.controls.map(c => `<label class="row"><span>${c.name}</span><input type="range" data-ctl="${c.name}" min="${c.min}" max="${c.max}" step="0.01" value="${pose[c.name] || 0}"><output>${(pose[c.name] || 0).toFixed(2)}</output></label>`).join("");
}
function syncControls() {
  for (const el of document.querySelectorAll("[data-ctl]")) { const v = pose[el.dataset.ctl] || 0; el.value = v; el.nextElementSibling.textContent = v.toFixed(2); }
}
document.getElementById("controls").addEventListener("input", e => {
  const k = e.target.dataset.ctl; if (!k) return;
  pose = { ...pose, [k]: +e.target.value }; e.target.nextElementSibling.textContent = (+e.target.value).toFixed(2);
  sc.pose(pose);
});

// ---- show ----
const toggle = (id, fn) => { const b = document.getElementById(id); b.onclick = () => { b.classList.toggle("on"); fn(b.classList.contains("on")); }; return b; };
for (const b of document.querySelectorAll("[data-view]")) b.onclick = () => view(b.dataset.view);
toggle("colours", applyLook); toggle("wire", applyLook); toggle("showJoints", showJoints); toggle("seeThrough", applyLook);
// the skull layer (parts/skull.js): only meshed while shown, so turning it on rebuilds
toggle("showSkull", on => { if (on && !ch.skull) rebuild(); else showSkull(); });
let skullObj = null;
function showSkull() {
  if (skullObj) { scene.remove(skullObj); skullObj.geometry.dispose(); skullObj.material.dispose(); skullObj = null; }
  if (!document.getElementById("showSkull").classList.contains("on") || !ch.skull) return;
  const g = new THREE.BufferGeometry();
  g.setAttribute("position", new THREE.BufferAttribute(Float32Array.from(ch.skull.positions), 3));
  g.setIndex(Array.from(ch.skull.indices)); g.computeVertexNormals();
  skullObj = new THREE.Mesh(g, new THREE.MeshStandardMaterial({ color: 0xe8dcc0, roughness: 0.7 }));
  scene.add(skullObj);
}
function applyLook() {
  const col = document.getElementById("colours").classList.contains("on"), wire = document.getElementById("wire").classList.contains("on");
  const thru = document.getElementById("seeThrough").classList.contains("on");
  for (const m of sc.meshes) { m.material.vertexColors = col; m.material.color.set(col ? 0xffffff : 0x8a8780); m.material.wireframe = wire;
    m.material.transparent = thru; m.material.opacity = thru ? 0.3 : 1; m.material.depthWrite = !thru; m.material.needsUpdate = true; }
}
function showJoints() {
  if (jointDots) { jointDots.forEach(d => d.parent.remove(d)); jointDots = null; }
  if (!document.getElementById("showJoints").classList.contains("on") || !sc) return;
  jointDots = sc.bones.map(b => {
    const d = new THREE.Mesh(new THREE.SphereGeometry(0.035), new THREE.MeshBasicMaterial({ color: 0xff5a2a, depthTest: false }));
    d.renderOrder = 10; const ax = new THREE.AxesHelper(0.15); ax.material.depthTest = false; ax.renderOrder = 10; d.add(ax);
    b.add(d); return d;
  });
  // the mouth's attachments (at rest): the skin line on each bill (where the skin reaches the beak), the attach
  // points on the cutting edges (where the corners start), and the gape lines back to the corners' ends
  const m = ch.info.mouth, over = c => new THREE.LineBasicMaterial({ color: c, depthTest: false });
  const line = (pts, c) => { const l = new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts.map(q => new THREE.Vector3(...q))), over(c)); l.renderOrder = 11; sc.group.add(l); jointDots.push(l); };
  line(m.skinLine.upper, 0x5ad1ff); line(m.skinLine.lower, 0x5ad1ff);
  for (const s of ["L", "R"]) {
    line(m.gapeLine[s], 0xffd23a);
    const d = new THREE.Mesh(new THREE.SphereGeometry(0.03), new THREE.MeshBasicMaterial({ color: 0x5ad1ff, depthTest: false }));
    d.position.set(...m.attach[s]); d.renderOrder = 11; sc.group.add(d); jointDots.push(d);
  }
}
// the Tripo raven in parts (the user split it in Tripo Studio: head, beak, eye_L, eye_R), already lined up on our head
// (scratchpad place_segmented.py: fitted onto the original Tripo raven as it was lined up here) with the brows coloured
// yellow from the hand tags; fixed while the sliders move
let overObj = null, tripo = null;
async function loadTripo() {
  return (await new GLTFLoader().loadAsync("../models/raven_segmented.glb")).scene;
}
// a copy of the Tripo raven moved `shift` along x, its beak part hidden under "Hide beaks". look: "over" (see-through,
// blue with yellow brows) or "beside" (solid, like ours)
function tripoMesh(shift, look) {
  const g = tripo.clone(true), hide = document.getElementById("hideBeaks").classList.contains("on");
  g.traverse(o => {
    if (!o.isMesh) return;
    if (!o.geometry.attributes.normal) o.geometry.computeVertexNormals();
    o.material = look === "over"
      ? new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.8, transparent: true, opacity: 0.4, depthWrite: false, side: THREE.DoubleSide })
      : new THREE.MeshStandardMaterial({ color: 0x55575e, roughness: 0.8, side: THREE.DoubleSide });
    if (o.name === "beak" && hide) o.visible = false;
  });
  g.position.x += shift;
  scene.add(g);
  return g;
}
let refObj = null;
function showTripo() {
  for (const o of [overObj, refObj]) if (o) { scene.remove(o); o.traverse(m => m.isMesh && m.material.dispose()); }
  overObj = refObj = null;
  if (!tripo) return;
  if (document.getElementById("overlay").classList.contains("on")) overObj = tripoMesh(0, "over");
  // (beside: to its right as seen from the front, far enough that the two don't touch)
  if (document.getElementById("ref").classList.contains("on")) refObj = tripoMesh(-4, "beside");
}
const tripoToggle = msg => async on => {
  if (on && !tripo) { status.textContent = "loading the Tripo raven…"; tripo = await loadTripo(); }
  if (on) status.textContent = msg;
  showTripo();
};
toggle("overlay", tripoToggle("Tripo raven over ours (blue, see-through; its brows yellow)"));
toggle("ref", tripoToggle("Tripo raven beside ours, facing the same way at the same size"));
// both beaks off, to compare the rest of the face: ours (the bills) and the Tripo raven's (its tagged beak faces)
toggle("hideBeaks", () => { showTripo(); hideBeaks(); });
function hideBeaks() {
  const off = document.getElementById("hideBeaks").classList.contains("on");
  for (const m of sc.meshes) if (/^(upper|lower)Beak_geo$/.test(m.name)) m.visible = !off;
}

// ---- files ----
// the closest the sliders get to the lined-up Tripo raven (a search over the shape sliders, scratchpad tripo_fit.mjs);
// the rest at their defaults
// (the neck by eye: the Tripo neck runs below our mesh box, so the search can't judge it)
const TRIPO_MATCH = { skullWidth: 1.2, skullHeight: 1.2, skullLength: 1.143, skullEgg: 0.015, skullTop: 0.4, skullDome: 0.014, skullBack: 0,
  skullForehead: 0.3, skullBase: -0.755, thickBase: 0.053, throat: 1, face: 0.75, beakSize: 2.5, beakHeight: -0.251, beak_length: 0.73,
  beak_depth: 0.6, beak_width: 0.326, beak_hook: 0.25, neckWidth: 0.8, neckFlare: 0.3, neckTilt: 0.05, neckBack: 0.3, throatDrop: 0.15, jawLine: 0.5,
  // the eye and brow against the Tripo raven's hand-tagged eye and brow (scratchpad brow_fit.mjs)
  eyeHeight: 0.37, eyeForward: 0.632, eyeSide: 49, eyeBulge: 0.56, browRidge: 0.3, browHeight: 10, browLength: 65.25,
  // where the beak meets the face, against the segmented Tripo raven (scratchpad junction_tripo.py, junction_fit.mjs,
  // posecheck.mjs): its socket rim (size, top, bottom, slant), beak tip and eyeball all within 0.06; the beak's base
  // peaked and tucked under the skin only 0.15, so the eyes are clear of it; the gape ending at the back of the mouth
  // corner (hand tag)
  beak_width: 0.521, beak_depth: 0.432, beak_lowerShare: 0.429, beakHeight: 0.001, beakSize: 2.404, beak_gapeTilt: 0.007,
  beak_peak: 1.929, beakTuck: 0.15, gapeBack: 0.2, gapeCurve: 0.11, face: 0, cheekPad: 0.24, cheekPadHeight: 0.063, jawLine: 0.53,
  throatDrop: 0, bridgeFwd: 0.596, eyeSide: 53.5, eyeBulge: 0.8, eyeSize: 0.262, nostrilAlong: 0.3,
  // (the face's skin onto the beak only 0.1: further, it ran into the corner's front on the cutting edges)
  joinWidth: 0.1,
  // the brows as the Tripo raven has them: the bulge over the eye socket is the brow (a ridge of the skin along the
  // socket's upper rim, no strips, no second ridge above it), fitted to its hand-tagged brows (scratchpad
  // brow_fit4.mjs, then by eye: one heavy hood over the socket)
  browOn: 0, browOnRim: 1, browHeight: 50, browRidge: 0.15, browOverhang: 0.1, browMass: 0.3, browLength: 140, browTilt: -12 };
document.getElementById("tripoMatch").onclick = () => setSliders({ ...DEFAULTS, ...TRIPO_MATCH });
document.getElementById("reset").onclick = () => setSliders(DEFAULTS);
function setSliders(v) {
  Object.assign(params, v);
  for (const el of box.querySelectorAll("input")) {
    if (el.type === "checkbox") { el.checked = params[el.dataset.key] >= 0.5; continue; }
    el.value = params[el.dataset.key]; el.nextElementSibling.textContent = (+el.value).toFixed(2);
  }
  rebuild();
}
document.getElementById("save").onclick = async () => {
  const out = document.getElementById("saved");
  out.textContent = "saving, then checking every pose…";
  const f = await exportFiles(ch);
  const b64 = btoa(Array.from(new Uint8Array(f.glb), c => String.fromCharCode(c)).join(""));
  try {
    const r = await fetch("/api/save", { method: "POST", body: JSON.stringify({ name: "raven_stylized", glb: b64, rig: f.rig, partition: f.partition, params, poses: POSES }) });
    const j = await r.json();
    out.innerHTML = [j.message, ...(j.posed || [])].map(s => s.replace(/&/g, "&amp;").replace(/</g, "&lt;")).join("<br>");
  } catch (e) { out.textContent = "couldn't save: run editor/serve.py (" + e + ")"; }
};

rebuild();
</script>
</body>
</html>
