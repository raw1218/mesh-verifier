name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build -j
      - name: Test
        run: ctest --test-dir build --output-on-failure
      # every example and model: its report and its web page
      - name: Run on the examples and models
        run: |
          mkdir -p out
          for f in examples/*.obj models/*.obj; do
            [ -e "$f" ] || continue
            name=$(basename "$f" .obj)
            ./build/mesh-verify "$f" > "out/$name.txt" || test $? -eq 1
            echo "$f: $(tail -n 1 "out/$name.txt")"
            ./build/mesh-verifier-web "$f" -o "out/$name.html"
          done
      # kept as a download on the run's page
      - uses: actions/upload-artifact@v4
        with:
          name: results
          path: out
