name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release -j 4
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      # every example and model: its report and its static web page
      - name: Run on the examples and models
        if: runner.os == 'Linux'
        run: |
          mkdir -p out
          for f in examples/*.obj models/*.obj; do
            [ -e "$f" ] || continue
            name=$(basename "$f" .obj)
            ./build/mesh-verify --format obj "$f" --headless > "out/$name.txt"
            echo "$f: $(tail -n 1 "out/$name.txt")"
            ./build/mesh-verifier-web "$f" -o "out/$name.html"
          done
      - name: Sweep the circle character's rig
        if: runner.os == 'Linux'
        run: |
          ./build/mesh-rig examples/rig/circle/circle.glb examples/rig/circle/circle.rig.json --sweep 5
          ./build/mesh-rig examples/rig/circle/circle_surface.glb examples/rig/circle/circle_surface.rig.json --sweep 5
      # kept as downloads on the run's page
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: results
          path: out
      - uses: actions/upload-artifact@v4
        with:
          name: mesh-verify-${{ runner.os }}
          path: |
            build/mesh-verify
            build/mesh-rig
            build/Release/mesh-verify.exe
            build/Release/mesh-rig.exe
          if-no-files-found: ignore
