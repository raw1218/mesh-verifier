name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build -j
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Run on the example
        run: |
          mkdir -p out
          ./build/mesh-verify examples/sphere_through_torus.obj | tee out/report.txt || test ${PIPESTATUS[0]} -eq 1
          ./build/mesh-verifier-web examples/sphere_through_torus.obj -o out/sphere_through_torus.html
      # the report and the web page, as a download on the run's page
      - uses: actions/upload-artifact@v4
        with:
          name: example
          path: out
