<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<style>
  :root { --bg: #16171a; --panel: #1f2024; --panel2: #26272c; --line: #34353b; --text: #e8e6e1; --muted: #9b978f; --accent: #4f8cff; --red: #ff5a4f; --yellow: #ffe14d; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 13px/1.4 system-ui, sans-serif; overflow: hidden; }
  #app { display: grid; height: 100%; grid-template-rows: auto 1fr auto; grid-template-columns: 250px 1fr 290px;
         grid-template-areas: "bar bar bar" "tree view props" "status status status"; }
  header { grid-area: bar; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 6px 8px; background: var(--panel); border-bottom: 1px solid var(--line); }
  header .brand { font-weight: 600; margin-right: 6px; }
  header .sep { width: 1px; height: 20px; background: var(--line); margin: 0 4px; }
  button, .btn, select { background: var(--panel2); color: var(--text); border: 1px solid var(--line); border-radius: 4px; padding: 3px 8px; font: inherit; cursor: pointer; }
  button:hover, .btn:hover { border-color: #55565e; }
  button:disabled { opacity: .4; cursor: default; }
  button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .group { display: inline-flex; }
  .group button { border-radius: 0; margin-left: -1px; }
  .group button:first-child { border-radius: 4px 0 0 4px; margin-left: 0; }
  .group button:last-child { border-radius: 0 4px 4px 0; }
  kbd { font: 11px ui-monospace, monospace; color: var(--muted); }
  aside { background: var(--panel); overflow: auto; }
  #outliner { grid-area: tree; border-right: 1px solid var(--line); }
  #props { grid-area: props; border-left: 1px solid var(--line); padding: 0 10px 10px; }
  h3 { margin: 0; padding: 8px 10px; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
  #props h3 { padding: 8px 0; }
  #view { grid-area: view; position: relative; min-width: 0; min-height: 0; }
  #view canvas { display: block; }
  #hint { position: absolute; left: 10px; bottom: 8px; color: var(--muted); font-size: 11px; pointer-events: none; text-shadow: 0 1px 2px #000; }
  #summary { position: absolute; left: 10px; top: 8px; background: rgba(30,31,35,.85); padding: 6px 9px; border-radius: 6px; pointer-events: none; }
  #summary b { color: var(--red); }
  #summary b.ok { color: #6fd38a; }
  #drop { position: absolute; inset: 0; border: 3px dashed var(--accent); background: rgba(79,140,255,.08); display: none; align-items: center; justify-content: center; font-size: 18px; pointer-events: none; }
  .row { display: flex; align-items: center; gap: 4px; padding: 2px 8px 2px 0; cursor: pointer; white-space: nowrap; border-left: 3px solid transparent; }
  .row:hover { background: var(--panel2); }
  .row.sel { background: #2b3a5c; border-left-color: var(--accent); }
  .row.dim { opacity: .45; }
  .row .caret { width: 14px; text-align: center; color: var(--muted); flex: none; }
  .row .name { overflow: hidden; text-overflow: ellipsis; }
  .row .idx { color: var(--muted); font-size: 11px; }
  .row .badge { background: var(--red); color: #fff; border-radius: 8px; padding: 0 6px; font-size: 11px; margin-left: auto; }
  .row .mod { color: var(--yellow); font-size: 11px; }
  .row .tris { color: var(--muted); font-size: 11px; margin-left: auto; }
  .row .badge + .tris { margin-left: 4px; }
  .field { display: grid; grid-template-columns: 62px 1fr 1fr 1fr; gap: 4px; align-items: center; margin: 4px 0; }
  .field label { color: var(--muted); }
  .field input { width: 100%; min-width: 0; background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 3px; padding: 3px 4px; font: 12px ui-monospace, monospace; }
  .field input:focus { outline: none; border-color: var(--accent); }
  .field input.x { border-bottom: 2px solid #e5484d; } .field input.y { border-bottom: 2px solid #46a758; } .field input.z { border-bottom: 2px solid #3e63dd; }
  .kv { display: grid; grid-template-columns: 70px 1fr; gap: 2px 6px; margin-bottom: 8px; }
  .kv span:nth-child(odd) { color: var(--muted); }
  .actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .note { color: var(--muted); font-size: 12px; margin-top: 8px; }
  .warn { color: var(--yellow); }
  footer { grid-area: status; display: flex; gap: 16px; padding: 4px 10px; background: var(--panel); border-top: 1px solid var(--line); color: var(--muted); min-height: 24px; }
  footer #msg.err { color: var(--red); }
</style>
</head>
<body>
<div id="app">
  <header>
    <span class="brand">Mesh Verifier</span>
    <label class="btn" title="Load an OBJ or GLB file (or drop one on the viewport)">Open&hellip;<input type="file" id="file" accept=".obj,.glb" hidden></label>
    <select id="format" title="Loader for the file: by extension, or forced">
      <option value="auto">format: by extension</option><option value="obj">format: OBJ</option><option value="glb">format: GLB</option>
    </select>
    <span class="sep"></span>
    <span class="group" id="modes">
      <button data-mode="translate" title="Translate (W)">Move <kbd>W</kbd></button>
      <button data-mode="rotate" title="Rotate (E)">Rotate <kbd>E</kbd></button>
      <button data-mode="scale" title="Scale (R)">Scale <kbd>R</kbd></button>
    </span>
    <span class="group" id="spaces" title="Transform space for the gizmo and the fields (Q toggles)">
      <button data-space="local">Local</button><button data-space="world">World</button>
    </span>
    <label title="Snap while dragging (hold Shift to toggle)"><input type="checkbox" id="snap"> Snap</label>
    <span class="sep"></span>
    <button id="undo" title="Undo (Ctrl+Z)">Undo</button>
    <button id="redo" title="Redo (Ctrl+Shift+Z / Ctrl+Y)">Redo</button>
    <button id="resetSel" title="Reset the selected component to its imported transform">Reset selected</button>
    <button id="resetAll" title="Reset every component to its imported transform">Reset all</button>
    <span class="sep"></span>
    <button id="frame" title="Frame the selection, or everything (F)">Frame <kbd>F</kbd></button>
    <label><input type="checkbox" id="wire" checked> Wireframe</label>
    <span id="layers" title="Highlight layers sent by the engine"></span>
  </header>
  <aside id="outliner"><h3>Components</h3><div id="tree"></div><h3>Intersecting components</h3><div id="nodePairs"></div></aside>
  <main id="view">
    <div id="summary"></div>
    <div id="hint">Click: select &middot; drag: orbit &middot; right-drag: pan &middot; wheel: zoom &middot; W/E/R: move/rotate/scale &middot; Q: local/world &middot; F: frame &middot; Esc: deselect &middot; Ctrl+Z: undo</div>
    <div id="drop">Drop an OBJ or GLB file to load it</div>
  </main>
  <aside id="props"><h3>Transform</h3><div id="propsBody"></div></aside>
  <footer><span id="stats"></span><span id="msg"></span></footer>
</div>
<script type="importmap">
{ "imports": { "three": "__THREE_BASE__build/three.module.js", "three/addons/": "__THREE_BASE__examples/jsm/" } }
</script>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { TransformControls } from "three/addons/controls/TransformControls.js";

const $ = id => document.getElementById(id);
const DEG = 180 / Math.PI;
const NEUTRAL = new THREE.Color(0xb8b4ac);

// ---------- server API ----------
async function api(method, path, body, raw = false) {
  const init = { method };
  if (body !== undefined) {
    init.body = raw ? body : JSON.stringify(body);
    init.headers = { "Content-Type": raw ? "application/octet-stream" : "application/json" };
  }
  const r = await fetch(path, init);
  let j = null;
  try { j = await r.json(); } catch { }
  if (!r.ok) throw new Error((j && j.error) || `${r.status} ${r.statusText}`);
  return j;
}

// ---------- three.js setup ----------
const view = $("view");
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(2, devicePixelRatio));
view.appendChild(renderer.domElement);
const world = new THREE.Scene();
world.background = new THREE.Color(0x16171a);
world.add(new THREE.HemisphereLight(0xffffff, 0x404050, 1.4));
const camera = new THREE.PerspectiveCamera(40, 1, 0.01, 1000);
const sun = new THREE.DirectionalLight(0xffffff, 1.5); sun.position.set(1, 2, 3); camera.add(sun); world.add(camera);
const orbit = new OrbitControls(camera, renderer.domElement);
orbit.enableDamping = true; orbit.dampingFactor = 0.15;

// The model's world space (turned to three.js's Y-up when the scene is Z-up): the components, mirroring the scene's
// hierarchy, and the engine's highlight layers, drawn as sent.
const display = new THREE.Group(); world.add(display);
const root = new THREE.Group(); display.add(root);
const layers = new THREE.Group(); display.add(layers);
const overlay = new THREE.Group(); world.add(overlay);     // the grid
let grid = null;

const gizmo = new TransformControls(camera, renderer.domElement);
world.add(gizmo.getHelper());

// ---------- state ----------
let comps = [];          // static component info from /api/scene
let state = null;        // the latest state from the server
let objects = [];        // THREE.Group per component
let meshes = [];         // THREE.Mesh per component (or null)
let errorCount = [];     // per component: its triangles in "error" layers
const hiddenLayers = new Set();
let selected = -1;
let mode = "translate", space = "local";
let dragging = false, dragGroup = "", dragCounter = 0, pending = null, inflight = false;
let sceneSize = 1;
const collapsed = new Set();

function message(text, isError = false) {
  const m = $("msg"); m.textContent = text || ""; m.className = isError ? "err" : "";
  if (!isError && text) setTimeout(() => { if (m.textContent === text) m.textContent = ""; }, 2500);
}
const fail = e => message(e.message || String(e), true);

// ---------- building the scene ----------
function disposeTree(o) { o.traverse(c => { if (c.geometry) c.geometry.dispose(); if (c.material) c.material.dispose(); }); }

function buildScene(data) {
  gizmo.detach();
  disposeTree(root); root.clear();
  delete $("propsBody").dataset.node;
  comps = data.components; objects = []; meshes = []; selected = -1; collapsed.clear();
  document.title = `${data.name} - Mesh Verifier`;
  display.rotation.x = data.state.view.up === "z" ? -Math.PI / 2 : 0;
  comps.forEach((c, i) => {
    const obj = new THREE.Group();
    obj.name = c.name; obj.userData.node = i; obj.visible = c.inScene;
    objects.push(obj); meshes.push(null);
    if (c.mesh >= 0) {
      const src = data.meshes[c.mesh];
      const tri = src.triangles, pos = src.positions;
      const p = new Float32Array(tri.length * 3);
      for (let k = 0; k < tri.length; k++) { p[3 * k] = pos[3 * tri[k]]; p[3 * k + 1] = pos[3 * tri[k] + 1]; p[3 * k + 2] = pos[3 * tri[k] + 2]; }
      const g = new THREE.BufferGeometry();
      g.setAttribute("position", new THREE.BufferAttribute(p, 3));
      g.computeVertexNormals();
      const mesh = new THREE.Mesh(g, new THREE.MeshStandardMaterial({ color: NEUTRAL, roughness: 0.7, side: THREE.DoubleSide, flatShading: true, polygonOffset: true, polygonOffsetFactor: 1, polygonOffsetUnits: 1 }));
      mesh.userData.node = i;
      const wire = new THREE.LineSegments(new THREE.WireframeGeometry(g), new THREE.LineBasicMaterial({ color: 0x1d1d22, transparent: true, opacity: 0.35 }));
      wire.userData.wire = true; wire.visible = $("wire").checked; wire.raycast = () => {};
      obj.add(mesh, wire);
      meshes[i] = mesh;
    }
  });
  comps.forEach((c, i) => (c.parent >= 0 ? objects[c.parent] : root).add(objects[i]));
  applyState(data.state);
  world.updateMatrixWorld(true);
  const box = sceneBox();
  sceneSize = box.isEmpty() ? 1 : box.getSize(new THREE.Vector3()).length() || 1;
  if (grid) { overlay.remove(grid); grid.geometry.dispose(); grid.material.dispose(); }
  const step = Math.pow(10, Math.floor(Math.log10(sceneSize)));
  grid = new THREE.GridHelper(step * 20, 20, 0x3a3b42, 0x2a2b30);
  grid.position.y = box.isEmpty() ? 0 : box.min.y;
  overlay.add(grid);
  updateSnap();
  frame(box);
  select(-1);
}

function sceneBox() {
  const box = new THREE.Box3();
  meshes.forEach((m, i) => { if (m && comps[i].inScene) box.expandByObject(m); });
  return box;
}

function setTransform(obj, t) {
  const m = new THREE.Matrix4().fromArray(t.matrix);
  m.decompose(obj.position, obj.quaternion, obj.scale);
  if (t.shear) { obj.matrixAutoUpdate = false; obj.matrix.copy(m); obj.matrixWorldNeedsUpdate = true; }
  else obj.matrixAutoUpdate = true;
}

function applyState(st) {
  state = st;
  st.nodes.forEach((n, i) => { if (!(dragging && i === selected)) setTransform(objects[i], n.local); });
  drawLayers(st.view);
  renderNodePairs(st.view.nodePairs);
  $("undo").disabled = !st.canUndo; $("redo").disabled = !st.canRedo;
  renderTree(); renderProps(); renderSummary();
}

// ---------- the engine's highlight layers: drawn as sent, no logic here ----------
function drawLayers(view) {
  disposeTree(layers); layers.clear();
  errorCount = comps.map(() => 0);
  const toggles = $("layers"); toggles.textContent = "";
  for (const o of view.overlays) {
    const [r, g, b, a] = o.color, color = new THREE.Color(r, g, b);
    const geometry = new THREE.BufferGeometry();
    geometry.setAttribute("position", new THREE.Float32BufferAttribute(o.positions, 3));
    let object;
    if (o.kind === "triangles") {
      object = new THREE.Mesh(geometry, new THREE.MeshBasicMaterial({ color, side: THREE.DoubleSide, transparent: a < 1, opacity: a,
        polygonOffset: true, polygonOffsetFactor: -1, polygonOffsetUnits: -1 }));
    } else {
      object = new THREE.LineSegments(geometry, new THREE.LineBasicMaterial({ color, transparent: true, opacity: a, depthTest: false }));
      object.renderOrder = 10;
    }
    object.raycast = () => {};
    object.visible = !hiddenLayers.has(o.id);
    layers.add(object);
    if (o.role === "error") for (const t of o.items) errorCount[t.node]++;
    const label = document.createElement("label");
    const box = document.createElement("input"); box.type = "checkbox"; box.checked = object.visible;
    box.onchange = () => { box.checked ? hiddenLayers.delete(o.id) : hiddenLayers.add(o.id); object.visible = box.checked; };
    label.append(box, ` ${o.label}`); label.style.marginRight = "6px";
    toggles.append(label);
  }
}

// the engine's set of intersecting components, listed as sent
function renderNodePairs(pairs) {
  const list = $("nodePairs"); list.textContent = "";
  if (!pairs.length) { const p = document.createElement("p"); p.className = "note"; p.style.padding = "0 10px"; p.textContent = "none"; list.append(p); return; }
  for (const p of pairs) {
    const row = document.createElement("div"); row.className = "row"; row.style.paddingLeft = "10px";
    const name = document.createElement("span"); name.className = "name";
    name.textContent = p.a.node === p.b.node ? `${p.a.name} (itself)` : `${p.a.name} × ${p.b.name}`;
    const n = document.createElement("span"); n.className = "badge"; n.textContent = p.pairs; n.title = `${p.pairs} intersecting triangle pairs`;
    row.title = `components #${p.a.node} and #${p.b.node}`;
    row.append(name, n);
    list.append(row);
  }
}

// ---------- selection and highlighting ----------
function isDescendant(i, ancestor) { for (let p = comps[i].parent; p >= 0; p = comps[p].parent) if (p === ancestor) return true; return false; }

function select(i) {
  selected = i;
  meshes.forEach((m, k) => {
    if (!m) return;
    m.material.emissive.setHex(k === i ? 0x1d3a78 : (i >= 0 && isDescendant(k, i)) ? 0x0f1f40 : 0x000000);
  });
  if (i >= 0 && comps[i].inScene) gizmo.attach(objects[i]); else gizmo.detach();
  if (i >= 0) for (let p = comps[i].parent; p >= 0; p = comps[p].parent) collapsed.delete(p);
  renderTree(); renderProps();
  const row = document.querySelector(`.row[data-node="${i}"]`);
  if (row) row.scrollIntoView({ block: "nearest" });
}

// ---------- outliner ----------
function renderTree() {
  const tree = $("tree"); tree.textContent = "";
  if (!state) return;
  const add = (i, depth) => {
    const c = comps[i], n = state.nodes[i];
    const row = document.createElement("div");
    row.className = "row" + (i === selected ? " sel" : "") + (c.inScene ? "" : " dim");
    row.dataset.node = i;
    row.style.paddingLeft = (4 + depth * 14) + "px";
    row.title = `${c.name} (component ${i})` + (c.inScene ? "" : ", not in the displayed scene");
    const caret = document.createElement("span"); caret.className = "caret";
    caret.textContent = c.children.length ? (collapsed.has(i) ? "\u25b8" : "\u25be") : "";
    caret.onclick = e => { e.stopPropagation(); collapsed.has(i) ? collapsed.delete(i) : collapsed.add(i); renderTree(); };
    const name = document.createElement("span"); name.className = "name"; name.textContent = c.name;
    const idx = document.createElement("span"); idx.className = "idx"; idx.textContent = `#${i}`;
    row.append(caret, name, idx);
    if (n.modified) { const m = document.createElement("span"); m.className = "mod"; m.textContent = "\u25cf"; m.title = "transformed"; row.append(m); }
    if (errorCount[i]) { const b = document.createElement("span"); b.className = "badge"; b.textContent = errorCount[i]; b.title = `${errorCount[i]} intersecting triangles`; row.append(b); }
    if (c.mesh >= 0) { const t = document.createElement("span"); t.className = "tris"; t.textContent = `${c.triangles}\u25b3`; row.append(t); }
    row.onclick = () => select(i);
    row.ondblclick = () => { select(i); frameSelection(); };
    tree.append(row);
    if (!collapsed.has(i)) c.children.forEach(k => add(k, depth + 1));
  };
  comps.forEach((c, i) => { if (c.parent < 0) add(i, 0); });
}

// ---------- properties ----------
const fmt = v => { const r = Number(v.toFixed(6)); return Object.is(r, -0) ? "0" : String(r); };

function currentTRS(i) {
  // during a drag, straight from the object; otherwise the server's values
  if (dragging && i === selected) {
    const obj = objects[i];
    if (space === "local") {
      const e = new THREE.Euler().setFromQuaternion(obj.quaternion, "ZYX");
      return { translation: obj.position.toArray(), rotationEuler: [e.x * DEG, e.y * DEG, e.z * DEG], scale: obj.scale.toArray() };
    }
    obj.updateWorldMatrix(true, false);
    const p = new THREE.Vector3(), q = new THREE.Quaternion(), s = new THREE.Vector3();
    obj.matrixWorld.decompose(p, q, s);
    const e = new THREE.Euler().setFromQuaternion(q, "ZYX");
    return { translation: p.toArray(), rotationEuler: [e.x * DEG, e.y * DEG, e.z * DEG], scale: s.toArray() };
  }
  return state.nodes[i][space];
}

function renderProps() {
  const body = $("propsBody");
  if (selected < 0 || !state) {
    delete body.dataset.node;
    body.innerHTML = `<p class="note">Select a component in the viewport or in the list to translate, rotate and scale it.</p>`;
    return;
  }
  const i = selected, c = comps[i], n = state.nodes[i];
  if (!body.dataset.node || +body.dataset.node !== i || body.dataset.space !== space) buildProps(body, i);
  const t = currentTRS(i);
  for (const key of ["translation", "rotationEuler", "scale"])
    for (let a = 0; a < 3; a++) {
      const input = body.querySelector(`input[data-key="${key}"][data-axis="${a}"]`);
      if (input && document.activeElement !== input) input.value = fmt(t[key][a]);
    }
  body.querySelector(".shear").style.display = state.nodes[i][space].shear ? "" : "none";
  body.querySelector(".modified").textContent = n.modified ? "transformed" : "as imported";
}

function buildProps(body, i) {
  const c = comps[i];
  body.dataset.node = i; body.dataset.space = space;
  const parent = c.parent >= 0 ? `${comps[c.parent].name} (#${c.parent})` : "none (root)";
  body.innerHTML = `
    <div class="kv"><span>Name</span><span class="nm"></span><span>Index</span><span>${i}</span><span>Parent</span><span class="pa"></span>
    <span>Triangles</span><span>${c.mesh >= 0 ? c.triangles : "none (a group)"}</span><span>State</span><span class="modified"></span></div>
    <div class="group" style="margin-bottom:6px"><button data-space="local">Local</button><button data-space="world">World</button></div>
    ${["translation:Position", "rotationEuler:Rotation \u00b0", "scale:Scale"].map(s => {
      const [key, label] = s.split(":");
      return `<div class="field"><label>${label}</label>${[0, 1, 2].map(a => `<input class="${"xyz"[a]}" type="number" step="any" data-key="${key}" data-axis="${a}" title="${label} ${"XYZ"[a]}">`).join("")}</div>`;
    }).join("")}
    <label class="note"><input type="checkbox" id="uniform"> Uniform scale</label>
    <div class="actions"><button id="resetNode">Reset</button><button id="resetSub">Reset with children</button><button id="frameSel">Frame</button></div>
    <p class="note">Values are in ${space === "local" ? "the parent's space (local)" : "world space"}; rotation is X, Y, Z order in degrees. Edits move the component's children with it.</p>
    <p class="note warn shear">This transform has shear (from a non-uniformly scaled parent): the values shown are its nearest translation, rotation and scale.</p>`;
  body.querySelector(".nm").textContent = c.name;
  body.querySelector(".pa").textContent = parent;
  body.querySelectorAll("[data-space]").forEach(b => { b.classList.toggle("on", b.dataset.space === space); b.onclick = () => setSpace(b.dataset.space); });
  body.querySelectorAll("input[data-key]").forEach(input => input.addEventListener("change", () => fieldChanged(input)));
  body.querySelector("#resetNode").onclick = () => reset(i, false);
  body.querySelector("#resetSub").onclick = () => reset(i, true);
  body.querySelector("#frameSel").onclick = frameSelection;
}

function fieldChanged(input) {
  const i = selected, key = input.dataset.key, body = $("propsBody");
  const inputs = [0, 1, 2].map(a => body.querySelector(`input[data-key="${key}"][data-axis="${a}"]`));
  const old = state.nodes[i][space][key];
  let v = inputs.map((el, a) => el.value.trim() === "" ? old[a] : Number(el.value));
  if (v.some(x => !Number.isFinite(x))) { message("enter a number", true); renderProps(); return; }
  if (key === "scale" && $("uniform").checked) {
    const a = +input.dataset.axis, ratio = old[a] !== 0 ? v[a] / old[a] : null;
    v = ratio === null ? [v[a], v[a], v[a]] : old.map(x => x * ratio);
  }
  edit({ node: i, space, [key]: v });
}

function renderSummary() {
  if (!state) return;
  const withGeometry = comps.filter(c => c.mesh >= 0 && c.inScene).length;
  const tris = comps.reduce((s, c) => s + (c.mesh >= 0 && c.inScene ? c.triangles : 0), 0);
  const flagged = errorCount.reduce((s, n) => s + n, 0);
  const k = state.intersections;
  $("summary").innerHTML = `${comps.length} component${comps.length === 1 ? "" : "s"}, ${tris} triangles<br>` +
    (k ? `<b>${k} intersecting pair${k === 1 ? "" : "s"}</b>, ${flagged} triangles in red` : `<b class="ok">no intersections</b>`);
  $("stats").textContent = `${document.title.replace(/ - Mesh Verifier$/, "")}: ${comps.length} components (${withGeometry} with geometry), ${tris} triangles, ${k} intersecting pairs`;
}

// ---------- edits ----------
async function edit(e) {
  try { applyState(await api("POST", "/api/transform", e)); } catch (err) { fail(err); renderProps(); }
}
async function reset(node, subtree) {
  try { applyState(await api("POST", "/api/reset", node === undefined ? {} : { node, subtree })); message(node === undefined ? "all components reset" : "reset"); } catch (err) { fail(err); }
}
async function undoRedo(which) { try { applyState(await api("POST", `/api/${which}`, {})); } catch (err) { fail(err); } }

// the gizmo's edits, sent as the drag goes (one request at a time, the latest values), all one undo step
function dragEdit() {
  const i = selected, obj = objects[i];
  if (mode === "translate") return { node: i, space: "local", translation: obj.position.toArray() };
  if (mode === "rotate") { const e = new THREE.Euler().setFromQuaternion(obj.quaternion, "ZYX"); return { node: i, space: "local", rotationEuler: [e.x, e.y, e.z].map(a => cleanAngle(a * DEG)) }; }
  return { node: i, space: "local", scale: obj.scale.toArray() };
}
function cleanAngle(d) { const r = Math.round(d * 1e9) / 1e9; return Math.abs(r - d) < 1e-9 ? r + 0 : d; }
function queueDrag() { pending = dragEdit(); if (!inflight) sendPending(); }
async function sendPending() {
  inflight = true;
  const body = pending; pending = null;
  try { const st = await api("POST", `/api/transform?group=${encodeURIComponent(dragGroup)}`, body); if (!pending) applyState(st); }
  catch (err) { fail(err); }
  inflight = false;
  if (pending) sendPending();
}

gizmo.addEventListener("dragging-changed", e => {
  orbit.enabled = !e.value;
  dragging = e.value;
  if (dragging) { dragGroup = `drag-${Date.now()}-${++dragCounter}`; objects[selected].matrixAutoUpdate = true; }
  else queueDrag();
});
gizmo.addEventListener("objectChange", () => { if (dragging) { queueDrag(); renderProps(); } });

// ---------- modes, space, snapping ----------
function setMode(m) { mode = m; gizmo.setMode(m); document.querySelectorAll("#modes button").forEach(b => b.classList.toggle("on", b.dataset.mode === m)); }
function setSpace(s) {
  space = s; gizmo.setSpace(s);
  document.querySelectorAll("[data-space]").forEach(b => b.classList.toggle("on", b.dataset.space === s));
  renderProps();
}
let shiftSnap = false;
function updateSnap() {
  const on = $("snap").checked !== shiftSnap;
  const step = Math.pow(10, Math.floor(Math.log10(sceneSize / 10)));
  gizmo.setTranslationSnap(on ? step : null);
  gizmo.setRotationSnap(on ? THREE.MathUtils.degToRad(15) : null);
  gizmo.setScaleSnap(on ? 0.1 : null);
}
document.querySelectorAll("#modes button").forEach(b => b.onclick = () => setMode(b.dataset.mode));
document.querySelectorAll("#spaces button").forEach(b => b.onclick = () => setSpace(b.dataset.space));
$("snap").onchange = updateSnap;
$("undo").onclick = () => undoRedo("undo");
$("redo").onclick = () => undoRedo("redo");
$("resetSel").onclick = () => { if (selected >= 0) reset(selected, false); else message("select a component first", true); };
$("resetAll").onclick = () => reset(undefined);
$("frame").onclick = () => selected >= 0 ? frameSelection() : frame(sceneBox());
$("wire").onchange = () => root.traverse(o => { if (o.userData.wire) o.visible = $("wire").checked; });

// ---------- camera ----------
function frame(box) {
  if (box.isEmpty()) return;
  const size = box.getSize(new THREE.Vector3()).length() || 1, centre = box.getCenter(new THREE.Vector3());
  let dir = camera.position.clone().sub(orbit.target);
  if (dir.lengthSq() === 0 || !isFinite(dir.lengthSq())) dir.set(0.6, 0.45, 1);
  dir.normalize();
  orbit.target.copy(centre);
  camera.position.copy(centre).addScaledVector(dir, size * 1.3);
  camera.near = size / 1000; camera.far = Math.max(size * 100, sceneSize * 100); camera.updateProjectionMatrix();
}
function frameSelection() {
  if (selected < 0) return frame(sceneBox());
  const box = new THREE.Box3();
  objects[selected].traverse(o => { if (o.isMesh && o.visible) box.expandByObject(o); });
  if (box.isEmpty()) box.setFromCenterAndSize(objects[selected].getWorldPosition(new THREE.Vector3()), new THREE.Vector3(1, 1, 1).multiplyScalar(sceneSize / 10));
  frame(box);
}

// ---------- picking ----------
const raycaster = new THREE.Raycaster();
let down = null;
renderer.domElement.addEventListener("pointerdown", e => { down = { x: e.clientX, y: e.clientY, gizmo: gizmo.axis !== null, button: e.button }; });
renderer.domElement.addEventListener("pointerup", e => {
  if (!down || down.gizmo || down.button !== 0 || Math.hypot(e.clientX - down.x, e.clientY - down.y) > 4) { down = null; return; }
  down = null;
  const r = renderer.domElement.getBoundingClientRect();
  raycaster.setFromCamera(new THREE.Vector2(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1), camera);
  const hit = raycaster.intersectObjects(meshes.filter(m => m && m.visible && comps[m.userData.node].inScene), false)[0];
  select(hit ? hit.object.userData.node : -1);
});

// ---------- keyboard ----------
addEventListener("keydown", e => {
  if (e.target.closest && e.target.closest("input, select, textarea")) { if (e.key === "Escape") e.target.blur(); return; }
  const k = e.key.toLowerCase();
  if ((e.ctrlKey || e.metaKey) && k === "z") { e.preventDefault(); undoRedo(e.shiftKey ? "redo" : "undo"); return; }
  if ((e.ctrlKey || e.metaKey) && k === "y") { e.preventDefault(); undoRedo("redo"); return; }
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (k === "w") setMode("translate");
  else if (k === "e") setMode("rotate");
  else if (k === "r") setMode("scale");
  else if (k === "q") setSpace(space === "local" ? "world" : "local");
  else if (k === "f") frameSelection();
  else if (k === "home") frame(sceneBox());
  else if (k === "escape") select(-1);
  else if (k === "shift" && !shiftSnap) { shiftSnap = true; updateSnap(); }
});
addEventListener("keyup", e => { if (e.key === "Shift") { shiftSnap = false; updateSnap(); } });

// ---------- loading files ----------
async function loadFile(file) {
  let format = $("format").value;
  if (format === "auto") {
    const ext = file.name.split(".").pop().toLowerCase();
    if (ext !== "obj" && ext !== "glb") { message(`can't tell the format of '${file.name}': choose OBJ or GLB`, true); return; }
    format = ext;
  }
  message(`loading ${file.name}\u2026`);
  try {
    const data = await api("POST", `/api/load?format=${format}&name=${encodeURIComponent(file.name)}`, await file.arrayBuffer(), true);
    buildScene(data);
    message(`loaded ${file.name}`);
  } catch (err) { fail(err); }
}
$("file").onchange = () => { const f = $("file").files[0]; if (f) loadFile(f); $("file").value = ""; };
view.addEventListener("dragover", e => { e.preventDefault(); $("drop").style.display = "flex"; });
view.addEventListener("dragleave", () => { $("drop").style.display = "none"; });
view.addEventListener("drop", e => { e.preventDefault(); $("drop").style.display = "none"; const f = e.dataTransfer.files[0]; if (f) loadFile(f); });

// ---------- main loop ----------
function resize() {
  const w = view.clientWidth, h = view.clientHeight;
  renderer.setSize(w, h); camera.aspect = w / Math.max(1, h); camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(view); resize();
renderer.setAnimationLoop(() => { orbit.update(); renderer.render(world, camera); });

setMode("translate"); setSpace("local");
camera.position.set(0.6, 0.45, 1);
try { buildScene(await api("GET", "/api/scene")); } catch (err) { fail(err); }

// for scripting from the browser console
window.meshVerifier = { api, select, edit, reset, get state() { return state; }, get components() { return comps; } };
</script>
</body>
</html>
